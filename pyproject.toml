[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crossfire"
version = "0.1.0"
description = "CROSSFIRE — Audience-Aware Argument Quality Simulator (El Baff, 2026)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "gunicorn",
    "requests",
    "beautifulsoup4",
    "python-dotenv",
    "pydantic>=2",
    "langchain>=0.3",
    "langchain-openai",
    "langchain-mistralai",
    "langchain-together",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic"]

[project.scripts]
crossfire = "crossfire.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crossfire = ["templates/*.html", "static/*"]
