<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% block title %}Argument Quality Simulator{% endblock %} · CROSSFIRE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
  {% block extra_head %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-crossfire d-flex align-items-center justify-content-between">
  <div>
    <a href="/" class="navbar-brand-title text-decoration-none">CROSSFIRE</a>
    <div class="navbar-subtitle">Argument Quality Simulator</div>
  </div>
  <div class="d-flex gap-3 align-items-center">
    <a href="/" class="nav-link-crossfire">Analyze</a>
    <span class="nav-link-crossfire" style="color:rgba(255,255,255,0.3)">|</span>
    <span class="nav-link-crossfire" style="font-style:italic;color:rgba(255,255,255,0.4)">El Baff, 2026</span>
  </div>
</nav>

{% block content %}{% endblock %}

<!-- Loading overlay -->
<div id="loading-overlay">
  <div class="spinner-cf"></div>
  <div class="loading-title">Simulating audience responses…</div>
  <div class="loading-subtitle">Running {{ '{' }}models{{ '}' }} × {{ '{' }}groups{{ '}' }} × 1 run in parallel</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
