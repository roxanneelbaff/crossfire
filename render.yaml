services:
  - type: web
    name: crossfire
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: gunicorn 'crossfire.app:app' --bind 0.0.0.0:$PORT --timeout 300 --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: NOVITA_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: LOG_WEBHOOK_URL
        sync: false
